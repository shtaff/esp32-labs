; =============================================================================
; Digital voice over LoRa - LilyGO TTGO LoRa32 T3_V1.6.1, 868 MHz
;
;   pio run -t upload -t monitor
;
; One binary, flashed to both boards. There is no TX build and no RX build:
; every unit is a half-duplex handset that listens until you hold PTT. Two
; boards with the same channel, the same codec mode and the same key talk to
; each other; nothing else is needed.
;
; Audio path:  INMP441 -> I2S -> Codec2 -> AES-128-CTR -> LoRa -> and back.
;
; Both the microphone and the amplifier are OPTIONAL at runtime. A board with
; neither still boots, still transmits (a synthetic test buzz in place of the
; microphone) and still receives, decodes and meters the audio on the OLED.
; That is deliberate: with one INMP441 and one MAX98357A between two boards you
; can still bring the whole link up and see it work from both ends.
; =============================================================================

[platformio]
extra_configs = secrets.ini
default_envs = voice

; -----------------------------------------------------------------------------
; Local secrets. Copy secrets.ini.example to secrets.ini (gitignored) and put a
; real key in it. A missing file falls back to the placeholder below, so the
; repository stays publishable and buildable as-is.
;
;   [voice] key  32 hex characters = the 128-bit AES key. It is the ONLY shared
;                secret; both handsets must carry the same one or encrypted
;                traffic from the other end decodes to noise.
;
; The all-zero placeholder is treated as "no key configured": the firmware
; boots, but refuses to arm encryption and says so on the display and the
; serial port rather than pretending to protect anything.
; -----------------------------------------------------------------------------
[voice]
key = 00000000000000000000000000000000

[env:voice]
; Pinned. The I2S code here is written against the LEGACY driver/i2s.h API,
; which is what Arduino-ESP32 2.0.x / IDF 4.4 ships. platform 8.x moves to
; Arduino 3.x / IDF 5.x, where that header is deprecated and the driver is
; driver/i2s_std.h instead. Unpin only if you are prepared to port audio.cpp.
platform = espressif32@7.0.1
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; Give the codec and the two audio DMA rings room. The stock "huge_app" layout
; is not needed - the binary is well under 1.9 MB - but Codec2 pulls in a lot
; of tables and the default 1.44 MB app partition gets uncomfortably close.
board_build.partitions = huge_app.csv

lib_deps =
    jgromes/RadioLib @ ^7.7.1
    sh123/esp32_codec2 @ ^1.0.7
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit GFX Library @ ^1.11.9

; Warnings on, but only for this project's own sources. Applying them globally
; buries the build in noise from the framework and from Codec2, which is a
; twenty-year-old DSP codebase and is not interested in our opinion of it.
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; -------------------------------------------------------------------------
    ; Codec2 build trim.
    ;
    ; The library is the whole of codec2-dev: nine speech modes, FreeDV, OFDM
    ; and LDPC. We use one mode at a time. Turning the rest off cuts several
    ; minutes off a clean build and keeps the tables out of flash.
    ;
    ; If you change VOICE_CODEC_MODE below, enable the matching mode here, or
    ; codec2_create() returns NULL and the firmware boots with no codec.
    ; -------------------------------------------------------------------------
    -DCODEC2_MODE_EN_DEFAULT=0
    -DCODEC2_MODE_3200_EN=1
    -DCODEC2_MODE_1600_EN=1
    -DCODEC2_MODE_700C_EN=1
    ; -------------------------------------------------------------------------
    ; The AES key, from [voice] above.
    ; -------------------------------------------------------------------------
    -DVOICE_KEY_HEX='"${voice.key}"'
    ; -------------------------------------------------------------------------
    ; Experiment knobs. Defaults live in include/config.h next to the airtime
    ; arithmetic that justifies them; uncomment to override.
    ; -------------------------------------------------------------------------
    ; Codec2 bit rate. 1600 is the default; 700C buys range, 3200 buys quality
    ; but needs -DVOICE_BW_KHZ=250 to fit in the air. See config.h.
    ; -DVOICE_CODEC_MODE=CODEC2_MODE_700C
    ; Codec2 frames bundled into one LoRa packet. Fewer = lower latency and
    ; worse airtime efficiency.
    ; -DVOICE_FRAMES_PER_PACKET=6
    ; Modem. SF7/BW125 is a standard EU 125 kHz channel.
    ; -DVOICE_SF=7
    ; -DVOICE_BW_KHZ=125.0f
    ; -DVOICE_CR=5
    ; Channel the handset comes up on, an index into VOICE_CHANNELS[].
    ; -DVOICE_DEFAULT_CHANNEL=5
    ; Start with encryption armed instead of off.
    ; -DVOICE_ENCRYPT_ON_BOOT
    ; Milliseconds of audio buffered before playback starts. Trades
    ; mouth-to-ear latency against tolerance of a late packet.
    ; -DVOICE_PREROLL_MS=320
    ; Escape hatches for boards with no display / no amplifier fitted. Neither
    ; is needed just to run without the hardware - both are detected or
    ; tolerated at runtime - but they save the code and the pins.
    ; -DNO_DISPLAY
    ; -DNO_AMP
