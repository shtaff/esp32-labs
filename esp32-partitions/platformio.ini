; =============================================================================
; esp32-partitions - print the flash partition table two ways.
;
;   pio run -t upload -t monitor
;
; Board: 4D Systems gen4-ESP32 (ESP32-S3, 16 MB flash, 8 MB PSRAM). Any ESP32
; will do - just change `board` and make sure partitions.csv fits its flash.
; =============================================================================
[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_port = COM11
upload_port = COM11

; The custom table in partitions.csv is what makes this lab interesting: both
; listings read back exactly what this file describes. Comment this line out to
; fall back to the board's stock table and watch the output change.
board_build.partitions = partitions.csv

build_flags =
    ; Routes `Serial` to the S3's native USB port rather than UART0, so connect
    ; to the USB connector, not the COM/UART one. Redundant here - the board
    ; definition already sets it - but spelled out because it decides which of
    ; the two ports your output appears on. Set it to 0 to use the COM port
    ; instead, and change monitor_port accordingly.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
