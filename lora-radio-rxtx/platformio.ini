; =============================================================================
; LoRa / FSK propagation research rig - LilyGO TTGO LoRa32 T3_V1.6.1
;
;   pio run -e tx        build the transmitter
;   pio run -e rx        build the receiver
;   pio run -e rx -t upload -t monitor
;
; One codebase, two binaries. The mode is a compile-time define, and
; build_src_filter removes the other mode's source file from the build outright,
; so the disabled half contributes nothing to the image - the transmitter does
; not even link TinyGPSPlus.
;
; Set the upload ports below to whatever your two boards enumerate as.
; =============================================================================

[platformio]
extra_configs = secrets.ini
default_envs = rx

; -----------------------------------------------------------------------------
; Local secrets. Copy secrets.ini.example to secrets.ini (gitignored) and fill
; it in; a missing file falls back to the harmless placeholders below, so the
; repository stays publishable and buildable as-is.
;
;   [wifi]  the transmitter needs it only to reach NTP. Without real values it
;           boots but refuses to transmit, since an unsynchronised transmitter
;           only fills slots nobody is watching.
;   [site]  the transmitter's real coordinate. It is deliberately NOT sent over
;           the air - this is an unencrypted public band - and it should not be
;           committed either. 0,0 makes distance_m and bearing_deg meaningless,
;           and both boards say so at boot.
; -----------------------------------------------------------------------------
[wifi]
ssid = YOUR_WIFI_SSID
password = YOUR_WIFI_PASSWORD

[site]
lat = 0.0
lon = 0.0

[env]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

lib_deps =
    jgromes/RadioLib @ ^7.7.1
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit GFX Library @ ^1.11.9

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; The transmitter site, from [site] above. Both modes need it: the receiver
    ; measures distance and bearing against it, the transmitter displays it.
    -DTX_SITE_LAT=${site.lat}
    -DTX_SITE_LON=${site.lon}
    ; Experiment parameters. The defaults live in include/config.h next to the
    ; duty-cycle arithmetic that justifies them; uncomment to override.
    ; -DSLOT_MS=20000
    ; -DREPEATS_PER_PROFILE=2
    ; -DRADIO_FREQ_MHZ=868.3f
    ; -DRADIO_POWER_DBM=14
    ; Escape hatch: skip the OLED entirely and run headless on the serial port.
    ; Useful if a board has no display fitted, or one that will not talk.
    ; -DNO_DISPLAY
    ; Seconds per screen on the OLED; 0 holds the first screen.
    ; -DSCREEN_AUTO_CYCLE_S=8

; -----------------------------------------------------------------------------
; Transmitter: WiFi + NTP + radio. No GPS, no display input.
; -----------------------------------------------------------------------------
[env:tx]
upload_port = COM10
monitor_port = COM10
build_src_filter = +<*> -<rx_app.cpp> -<gps_module.cpp>
build_flags =
    ${env.build_flags}
    -DAPP_MODE_TX
    -DWIFI_SSID='"${wifi.ssid}"'
    -DWIFI_PASSWORD='"${wifi.password}"'

; -----------------------------------------------------------------------------
; Receiver: radio + GPS + display + logging. No WiFi at all.
; -----------------------------------------------------------------------------
[env:rx]
upload_port = COM5
monitor_port = COM5
build_src_filter = +<*> -<tx_app.cpp>
lib_deps =
    ${env.lib_deps}
    mikalhart/TinyGPSPlus @ ^1.0.3
build_flags =
    ${env.build_flags}
    -DAPP_MODE_RX
